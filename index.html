<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mooni Mani | Shop All Nails</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fffcfb;
    color: #38272e;
}

a {
    color: inherit;
    text-decoration: none;
}

button, select {
    font: inherit;
    cursor: pointer;
}

/* HEADER */

header {
    background: #f9e9ee;
    text-align: center;
    padding: 26px 15px;
}

.logo {
    font: bold 32px Georgia, serif;
    letter-spacing: 2px;
}

.tagline {
    color: #9c7585;
    font-size: 12px;
    letter-spacing: 1px;
}

/* NAVIGATION */

nav {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
    margin-top: 22px;
    font-size: 14px;
}

nav a:hover {
    color: #b87890;
}

/* MAIN */

main {
    max-width: 1250px;
    margin: auto;
    padding: 45px 25px 85px;
}

h1 {
    font-size: 42px;
    margin-bottom: 28px;
}

/* FILTER BUTTONS */

.filters {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.filter {
    background: white;
    border: 1px solid #e9dfe2;
    border-radius: 25px;
    padding: 11px 18px;
}

.filter.active {
    background: #38272e;
    color: white;
}

.filter:hover {
    border-color: #b87890;
}

/* SORTING */

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eadfe2;
    padding-bottom: 20px;
    margin-bottom: 30px;
    color: #8d7980;
    font-size: 14px;
}

.toolbar select {
    padding: 10px;
    border: 1px solid #eadfe2;
    border-radius: 8px;
    background: white;
    color: #38272e;
}

/* PRODUCT GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 35px 20px;
}

/* PRODUCT PHOTOS */

.photo {
    aspect-ratio: 1 / 1.1;
    background: #f6e9ed;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #a88896;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
   
    /* Peach Veil only */

.photo:has(a[href*="id=2"]) img {
    object-fit: contain;
    width: 85%;
    height: 85%;
}

.photo-link {
    display: block;
}

.photo-link:hover {
    opacity: 0.85;
}

/* PRODUCT DETAILS */

.card h3 {
    font-size: 16px;
    margin: 14px 0 7px;
}

.card h3 a:hover {
    color: #b87890;
}

.meta {
    color: #8d7980;
    font-size: 13px;
    margin-bottom: 9px;
}

.price {
    font-weight: bold;
    font-size: 16px;
}

/* LIVE INVENTORY STATUS */

.stock-status {
    margin-top: 10px;
    min-height: 18px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.6px;
    color: #a46c82;
}

.stock-status.sold-out {
    color: #ad657b;
}

.stock-status.unavailable {
    color: #8d7980;
    font-weight: normal;
    letter-spacing: 0;
}

/* FOOTER */

footer {
    background: #f9e9ee;
    text-align: center;
    padding: 30px;
    font-size: 13px;
    color: #806b74;
}

/* RESPONSIVE DESIGN */

@media (max-width: 900px) {

    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media (max-width: 650px) {

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 25px 12px;
    }

    h1 {
        font-size: 32px;
    }

    nav {
        gap: 14px;
    }

    .toolbar {
        gap: 10px;
        flex-wrap: wrap;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        ☾ Mooni Mani
    </div>

    <p class="tagline">
        A little moonlight at your fingertips ✨
    </p>

    <nav>

        <a href="index.html">Home</a>

        <a href="index.html#shop">Shop</a>

        <a href="faq.html">FAQ</a>

        <a href="contact.html">Contact</a>

        <a href="cart.html">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>

    </nav>

</header>


<!-- SHOP -->

<main id="shop">

    <h1>Shop All Nails</h1>

    <!-- FILTERS -->

    <div class="filters">

        <button class="filter active" data-filter="All">
            All
        </button>

        <button class="filter" data-filter="Almond">
            Almond
        </button>

        <button class="filter" data-filter="Coffin">
            Coffin
        </button>

        <button class="filter" data-filter="Stiletto">
            Stiletto
        </button>

        <button class="filter" data-filter="Square">
            Square
        </button>

        <button class="filter" data-filter="Oval">
            Oval
        </button>

        <button class="filter" data-filter="Short">
            Short
        </button>

        <button class="filter" data-filter="Medium">
            Medium
        </button>

        <button class="filter" data-filter="Long">
            Long
        </button>

    </div>


    <!-- SORTING -->

    <div class="toolbar">

        <span id="count">5 sets</span>

        <label for="sort">
            Sort by:

            <select id="sort">

                <option value="bestselling">
                    Best Selling
                </option>

                <option value="newest">
                    Newest
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

            </select>

        </label>

    </div>


    <!-- PRODUCTS -->

    <div class="grid" id="grid"></div>

</main>


<!-- FOOTER -->

<footer>

    © 2026 Mooni Mani ♡

    <br><br>

    Made with love & a little moonlight.

</footer>


<!-- SUPABASE INVENTORY FILES -->

<script src="inventory.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-inventory.js"></script>


<!-- JAVASCRIPT -->

<script>

/* PRODUCT DATA */

const products = [

    {
        id: 1,
        name: "Moonlight Collection",
        shape: "Almond",
        length: "Medium",
        price: 12,
        image: "Gothic%20Romantic%20Press-On%20Nail%20Sets.png",
        salesRank: 1,
        dateAdded: "2026-10-20"
    },

    {
        id: 2,
        name: "Peach Veil",
        shape: "Square",
        length: "Short",
        price: 12,
        image: "peachveil.png",
        salesRank: 2,
        dateAdded: "2026-10-22"
    },

    {
        id: 3,
        name: "Baby Blue Blooms",
        shape: "Oval",
        length: "Short",
        price: 12,
        image: "babyblueblooms.png",
        salesRank: 3,
        dateAdded: "2026-10-24"
    },

    {
        id: 4,
        name: "Cherry Noir",
        shape: "Coffin",
        length: "Long",
        price: 12,
        image: "cherrynoir.png",
        salesRank: 4,
        dateAdded: "2026-10-26"
    },

    {
        id: 5,
        name: "Blush & Bloom",
        shape: "Stiletto",
        length: "Long",
        price: 12,
        image: "blushandblace.png",
        salesRank: 5,
        dateAdded: "2026-10-28"
    },
    
    {
        id: 6,
        name: "Crimson Coquette",
        shape: "Stiletto",
        length: "Long",
        price: 12,
        image: "crimsoncoquette.png",
        salesRank: 6,
        dateAdded: "2026-10-28"
    },
   
    {
        id: 7,
        name: "Ivory Eclipse",
        shape: "Stiletto",
        length: "Long",
        price: 12,
        image: "ivoryeclipse.png",
        salesRank: 7,
        dateAdded: "2026-10-28"
    },
    
    {
        id: 8,
        name: "Sakura Stardust",
        shape: "Stiletto",
        length: "Long",
        price: 12,
        image: "sakurastardust.png",
        salesRank: 8,
        dateAdded: "2026-10-28"
    },
    {
        id: 9,
        name: "Starstruck",
        shape: "Stiletto",
        length: "Long",
        price: 12,
        image: "starstruck.png",
        salesRank: 9,
        dateAdded: "2026-10-28"
    },
    {
        id:10,
        name: "Pink Daydream",
        shape: "stilletto",
        length: "long",
        price: 12,
        image: "pinkdaydream.png",
        salesRank: 10,
        dateAdded:"2026-10-29"
    }
    
];

/* FILTER */

let activeFilter = "All";


/* INVENTORY STATE */

/*
    null      = still checking
    "soldout" = no sizes available
    "instock" = at least one size available
    "error"   = inventory could not be verified
*/

const productAvailability = {};

const nailSizes = ["XS", "S", "M", "L"];


/* READ CART */

function readCart() {

    try {

        const cart = JSON.parse(
            localStorage.getItem("moonimani-cart")
        );

        return Array.isArray(cart) ? cart : [];

    } catch {

        return [];

    }

}


/* UPDATE CART COUNT */

function updateCount() {

    const count = readCart().reduce(
        (total, item) => total + (Number(item.quantity) || 0),
        0
    );

    document.getElementById("cart-count").textContent = count;

}


/* INVENTORY STATUS HTML */

function getAvailabilityHTML(productId) {

    const status = productAvailability[productId];

    if (status === "soldout") {

        return `
            <div class="stock-status sold-out">
                SOLD OUT
            </div>
        `;

    }

    if (status === "instock") {

        return `
            <div class="stock-status">
                In Stock ♡
            </div>
        `;

    }

    if (status === "error") {

        return `
            <div class="stock-status unavailable">
                Availability unavailable
            </div>
        `;

    }

    return `
        <div class="stock-status unavailable">
            Checking availability…
        </div>
    `;

}


/* DISPLAY PRODUCTS */

function renderProducts() {

    let list = products.filter(product =>

        activeFilter === "All" ||

        product.shape === activeFilter ||

        product.length === activeFilter

    );


    /* SORT PRODUCTS */

    const sort = document.getElementById("sort").value;


    /* BEST SELLING */

    if (sort === "bestselling") {

        list.sort((a, b) => a.salesRank - b.salesRank);

    }


    /* NEWEST */

    if (sort === "newest") {

        list.sort((a, b) =>
            b.dateAdded.localeCompare(a.dateAdded)
        );

    }


    /* PRICE: LOW TO HIGH */

    if (sort === "low") {

        list.sort((a, b) => a.price - b.price);

    }


    /* PRICE: HIGH TO LOW */

    if (sort === "high") {

        list.sort((a, b) => b.price - a.price);

    }


    /* PRODUCT COUNT */

    document.getElementById("count").textContent =
        list.length + " sets";


    /* PRODUCT GRID */

    const grid = document.getElementById("grid");

    grid.innerHTML = "";


    list.forEach(product => {

        const card = document.createElement("article");

        card.className = "card";


        /* PRODUCT PHOTO */

        const photo = product.image

            ? `<img src="${product.image}" alt="${product.name}">`

            : "♡<br>Product photo coming soon";


        /* PRODUCT CARD */

        card.innerHTML = `

            <a
                class="photo-link"
                href="product.html?id=${product.id}"
                aria-label="View ${product.name}"
            >

                <div class="photo">

                    ${photo}

                </div>

            </a>


            <h3>

                <a href="product.html?id=${product.id}">

                    ${product.name}

                </a>

            </h3>


            <div class="meta">

                ${product.length} ${product.shape}

            </div>


            <div class="price">

                $${product.price.toFixed(2)}

            </div>


            ${getAvailabilityHTML(product.id)}

        `;


        grid.appendChild(card);

    });

}


/* LOAD LIVE INVENTORY */

async function loadHomepageInventory() {

    if (typeof getLiveStock !== "function") {

        console.error(
            "Supabase inventory function is missing."
        );

        products.forEach(product => {

            productAvailability[product.id] = "error";

        });

        renderProducts();

        return;

    }

    /*
        Each product has four sizes.

        If every size has stock 0,
        the entire collection is SOLD OUT.

        If at least one size has stock,
        the collection is In Stock.

        If inventory cannot be verified,
        we show an unavailable message
        instead of assuming stock exists.
    */

    await Promise.all(

        products.map(async product => {

            try {

                const stocks = await Promise.all(

                    nailSizes.map(size =>
                        getLiveStock(product.id, size)
                    )

                );

                const validStocks = stocks.every(stock =>

                    Number.isInteger(stock) &&
                    stock >= 0

                );

                if (!validStocks) {

                    throw new Error(
                        "Could not verify inventory."
                    );

                }

                const hasStock = stocks.some(stock =>
                    stock > 0
                );

                productAvailability[product.id] =
                    hasStock ? "instock" : "soldout";

            } catch (error) {

                console.error(
                    `Inventory error for ${product.name}:`,
                    error
                );

                productAvailability[product.id] = "error";

            }

            /*
                Update the product grid as each
                collection finishes checking.
            */

            renderProducts();

        })

    );

}


/* FILTER BUTTONS */

document.querySelectorAll(".filter").forEach(button => {

    button.onclick = () => {

        activeFilter = button.dataset.filter;

        document.querySelectorAll(".filter").forEach(b => {

            b.classList.toggle(
                "active",
                b === button
            );

        });

        renderProducts();

    };

});


/* SORT DROPDOWN */

document.getElementById("sort").onchange = renderProducts;


/* INITIALIZE */

updateCount();

renderProducts();

loadHomepageInventory();

</script>

</body>
</html>
